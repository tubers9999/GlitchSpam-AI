name: Build & Release GlitchSpam APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Export Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare and Sign Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p dist
          
          # Generate signing keystore
          keytool -genkeypair -v -keystore release.keystore \
            -alias glitchspam -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass redglitchx -keypass redglitchx \
            -dname "CN=GlitchSpam, OU=redglitchx, O=redglitchx, L=Bucharest, ST=RO, C=RO"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # Copy debug APK
          cp app/build/outputs/apk/debug/app-debug.apk dist/GlitchSpam-AI-debug.apk

          # Build release
          ./gradlew assembleRelease --stacktrace || true

          UNSIGNED_APK=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -f "$UNSIGNED_APK" ]; then
            $ZIPALIGN -f -p 4 "$UNSIGNED_APK" dist/GlitchSpam-AI-release-aligned.apk
            $APKSIGNER sign \
              --ks release.keystore \
              --ks-pass pass:redglitchx \
              --ks-key-alias glitchspam \
              --key-pass pass:redglitchx \
              --min-sdk-version 24 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out dist/GlitchSpam-AI-v1.0.0.apk \
              dist/GlitchSpam-AI-release-aligned.apk
            
            $APKSIGNER verify --verbose dist/GlitchSpam-AI-v1.0.0.apk
          else
            cp dist/GlitchSpam-AI-debug.apk dist/GlitchSpam-AI-v1.0.0.apk
          fi

          echo "Final APKs in dist/:"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlitchSpam-AI-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-CYBER
          name: "GlitchSpam AI v1.0.0 (by redglitchx)"
          files: dist/*.apk
          draft: false
          prerelease: false
          body: |
            ## ⚡ GlitchSpam AI v1.0.0 — Universal Multi-App Auto-Roaster & Spammer
            **Engineered & Developed by redglitchx**
            
            ### 🔥 Features Included:
            - **Universal Multi-App Support**: Operates in real-time on WhatsApp, Discord, Telegram, Messenger, Instagram, or any Android app.
            - **Custom HTTPS AI Endpoint + Bearer API Key**: Works with OpenAI, OpenRouter, Groq, DeepSeek, or private servers.
            - **Auto-Detect Models**: Queries `/models` endpoint and populates the model selector dynamically.
            - **Bypass / Jailbreak Mode**: Uncensored savage system prompt overriding safety guardrails.
            - **Savage Romanian Roast Engine**: Street-smart comebacks, burns, and insults in Romanian (*"să-l înjure și să-l pună la punct"*). Also supports English, Spanish, German, French, or Auto-Detect.
            - **Turbo Spammer Engine**: High-speed auto-typing and clicking with configurable delay (down to 50ms) and burst multiplier.
            - **Floating Bubble & Draggable HUD Overlay**: Floating chat head with status LED, expands to floating control window over WhatsApp/Discord.
            - **Shake-to-Kill Panic Switch**: Instantly stops spamming when device is shaken.
            - **Built-in Offline Arsenal**: 80+ Romanian roasts for offline or rate-limited scenarios.
            
            ### 📥 Download:
            Download **`GlitchSpam-AI-v1.0.0.apk`** below and install on any Android device (Android 7.0+).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
